[project]
name = "quizzerapp-backend"
version = "0.1.0"
description = "QuizzerApp FastAPI backend with RAG capabilities"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mangum>=0.19.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[async]>=3.2.3",
    "pgvector>=0.3.5",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    # RAG
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "openai>=1.51.0",
    "anthropic>=0.36.0",
    # PDF/OCR
    "pdfplumber>=0.11.4",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    # Storage
    "boto3>=1.35.30",
    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic[email]>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "aiosmtplib>=5.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
]
