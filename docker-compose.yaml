services:

  # ─── PostgreSQL 16 + pgvector ──────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quizzerapp_postgres
    environment:
      POSTGRES_USER: quizzer
      POSTGRES_PASSWORD: quizzer_dev_pass
      POSTGRES_DB: quizzerapp
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizzer -d quizzerapp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - quizzer_net

  # ─── pgAdmin 4 — Database GUI (http://localhost:5050) ─────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: quizzerapp_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@quizzer.dev
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_pass
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/postgres/pgadmin_servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quizzer_net

# ─── Named volumes (data persists across container restarts) ─────────────────
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

# ─── Isolated bridge network ─────────────────────────────────────────────────
networks:
  quizzer_net:
    driver: bridge
